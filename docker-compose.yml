services: 
  db: 
    image: postgres:17-alpine 
    env_file: .env.docker 
    volumes: 
      - postgres-data:/var/lib/postgresql/data 
    ports: 
      - "5434:5432" 
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"${POSTGRES_USER:-workout}\" -d \"${POSTGRES_DB:-workoutdb}\""] 
      interval: 5s 
      retries: 10 
    restart: unless-stopped 

  api:
    build: .
    env_file: .env.docker
    environment: 
      - APP_ENV=docker
      - DATABASE_URL=postgresql+psycopg://workout:workout@db:5432/workoutdb
    depends_on:
      - db
    ports:
      - "8003:8000"

volumes:
  postgres-data: {}