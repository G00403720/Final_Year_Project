<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | FitWeek</title>
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="brand">FITWEEK</div>
      <h1>Create account</h1>
      <p class="sub">Your workouts and schedule will belong only to your account.</p>

      <form id="registerForm">
        <label for="name">Name</label>
        <input id="name" type="text" autocomplete="name" required>

        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" type="password" minlength="8" autocomplete="new-password" required>

        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>

        <button type="submit">Create account</button>
        <div class="message" id="message"></div>
      </form>

      <div class="switch">Already have an account? <a href="/login.html">Log in</a></div>
    </section>
  </main>

  <script src="/auth.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async event => {
      event.preventDefault();
      const message = document.getElementById('message');
      message.textContent = '';

      const password = document.getElementById('password').value;
      if (password !== document.getElementById('confirmPassword').value) {
        message.textContent = 'Passwords do not match.';
        return;
      }

      const response = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password
        })
      });

      const data = await response.json();
      if (!response.ok) {
        message.textContent = data.error || 'Registration failed.';
        return;
      }

      saveSession(data);
      window.location.href = '/';
    });
  </script>
</body>
</html>
